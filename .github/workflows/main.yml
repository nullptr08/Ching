name: Discover and Scrape Admission Results

on:
  workflow_dispatch:
    inputs:
      discovery_max_empty:
        description: 'Stop after N consecutive empty IDs (default: 10000)'
        required: false
        default: '10000'
        type: string

env:
  PYTHON_VERSION: '3.11'

jobs:
  # Phase 1: Discover where valid IDs actually start
  discover:
    runs-on: ubuntu-latest
    outputs:
      first_valid_id: ${{ steps.find.outputs.first_valid_id }}
      last_valid_id: ${{ steps.find.outputs.last_valid_id }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Find valid ID range
        id: find
        run: |
          python - << 'EOF'
          import requests
          import os
          import sys
          import re
          from bs4 import BeautifulSoup
          
          BASE_URL = "https://daleel.admission.gov.sd/result2026/Result_2026.aspx"
          MAX_EMPTY = int(os.environ.get('DISCOVERY_MAX_EMPTY', 10000))
          
          # Exact error messages that indicate invalid ID
          INVALID_MESSAGES = [
              "رقم الاستمارة غير صحيح",
              "لا توجد نتيجة",
              "غير موجود",
              "خطأ",
              "not found",
              "error",
              "invalid",
              "no result"
          ]
          
          def check_id(app_id):
              """Check if a single ID exists and returns valid result"""
              try:
                  session = requests.Session()
                  session.headers.update({"User-Agent": "University-Authorized-Test/1.0"})
                  
                  # Load form
                  resp = session.get(BASE_URL, timeout=15)
                  soup = BeautifulSoup(resp.text, "html.parser")
                  form = soup.find("form", id="form1")
                  
                  if not form:
                      return False, "no_form"
                  
                  payload = {}
                  for field in form.select('input[type="hidden"][name]'):
                      name = field["name"]
                      if name.lower() in {"txtcaptcha", "shareresultfield"}:
                          continue
                      payload[name] = field.get("value", "")
                  
                  payload.update({
                      "DropDownList1": "1",
                      "TextBox1": f"{app_id:08d}",
                      "Button1": "عرض النتيجة",
                  })
                  
                  resp = session.post(BASE_URL, data=payload, timeout=15)
                  soup = BeautifulSoup(resp.text, "html.parser")
                  
                  # Get full page text for analysis
                  page_text = soup.get_text(" ", strip=True)
                  
                  # Check for invalid ID messages
                  for invalid_msg in INVALID_MESSAGES:
                      if invalid_msg in page_text:
                          return False, f"invalid_msg: {invalid_msg}"
                  
                  # Check LabelMessage specifically
                  message_elem = soup.find(id="LabelMessage")
                  message_text = ""
                  if message_elem:
                      message_text = message_elem.get_text(" ", strip=True)
                      for invalid_msg in INVALID_MESSAGES:
                          if invalid_msg in message_text:
                              return False, f"label_invalid: {invalid_msg}"
                  
                  # Check for result indicators:
                  # 1. Tables with data
                  tables = soup.find_all("table")
                  has_tables = len(tables) > 0
                  
                  # 2. Any div/span with substantial content (not just navigation)
                  content_divs = soup.find_all(["div", "span", "td"], string=re.compile(r'\w{3,}'))
                  has_content = len(content_divs) > 5
                  
                  # 3. Look for grade/score patterns (numbers, percentages)
                  has_scores = bool(re.search(r'\d+%?|\d+\.\d+', page_text))
                  
                  # 4. Check if page has substantial text (not just form elements)
                  text_length = len(page_text)
                  
                  # Debug output
                  print(f"  ID {app_id:08d}: tables={has_tables}, content={has_content}, scores={has_scores}, text_len={text_length}, msg='{message_text[:50]}'")
                  
                  # Valid if: has tables OR (has content AND scores AND reasonable text length)
                  is_valid = has_tables or (has_content and has_scores and text_length > 200)
                  
                  return is_valid, "valid" if is_valid else "insufficient_data"
                  
              except Exception as e:
                  print(f"  ID {app_id:08d}: ERROR - {e}")
                  return False, f"error: {e}"
          
          # Test a known ID first for debugging
          print("Testing known ID format...")
          test_id = 11044052  # Your original START_INDEX
          is_valid, reason = check_id(test_id)
          print(f"Test ID {test_id}: valid={is_valid}, reason={reason}")
          
          if not is_valid:
              print("WARNING: Even the known test ID failed! Check site structure.")
              print("Continuing anyway...")
          
          # Exponential search to find first valid ID
          print("\nStarting discovery...")
          first_valid = None
          
          # Check if ID 1 exists
          print("Checking ID 1...")
          is_valid, reason = check_id(1)
          if is_valid:
              first_valid = 1
              print("Found valid ID at start: 1")
          else:
              print(f"ID 1 invalid: {reason}")
              print("Searching for boundary...")
              boundary = 1
              while boundary < 99999999:
                  print(f"Checking boundary: {boundary}")
                  is_valid, reason = check_id(boundary)
                  if is_valid:
                      first_valid = boundary
                      print(f"Found valid at boundary: {boundary}")
                      break
                  boundary *= 2
                  if boundary > 99999999:
                      boundary = 99999999
              
              if first_valid:
                  # Binary search between boundary/2 and boundary
                  low = max(1, boundary // 2)
                  high = boundary
                  while low < high:
                      mid = (low + high) // 2
                      is_valid, reason = check_id(mid)
                      if is_valid:
                          high = mid
                      else:
                          low = mid + 1
                  first_valid = low
          
          if not first_valid:
              print("No valid IDs found in entire range!")
              print("Possible issues:")
              print("1. Site requires CAPTCHA")
              print("2. Site structure changed")
              print("3. All IDs are actually invalid")
              sys.exit(1)
          
          print(f"\nFirst valid ID: {first_valid}")
          
          # Now find last valid ID (scan forward until MAX_EMPTY consecutive misses)
          last_valid = first_valid
          empty_streak = 0
          current = first_valid + 1
          
          print(f"Scanning forward from {current} to find last valid ID...")
          
          while empty_streak < MAX_EMPTY and current <= 99999999:
              is_valid, reason = check_id(current)
              if is_valid:
                  last_valid = current
                  empty_streak = 0
                  if current % 100 == 0:
                      print(f"Found valid ID: {current}, continuing...")
              else:
                  empty_streak += 1
              
              current += 1
              
              if current % 1000 == 0:
                  print(f"Scanned up to {current}, last valid: {last_valid}, empty streak: {empty_streak}")
          
          print(f"\nLast valid ID: {last_valid}")
          print(f"Total valid range: {first_valid} to {last_valid}")
          print(f"Estimated valid IDs: {last_valid - first_valid + 1}")
          
          # Set outputs
          print(f"::set-output name=first_valid_id::{first_valid}")
          print(f"::set-output name=last_valid_id::{last_valid}")
          EOF
        env:
          DISCOVERY_MAX_EMPTY: ${{ github.event.inputs.discovery_max_empty || '10000' }}

  # Phase 2: Scrape discovered range in 4 parallel batches
  scrape:
    needs: discover
    if: needs.discover.outputs.first_valid_id != ''
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        batch_id: [0, 1, 2, 3]
    
    name: Batch ${{ matrix.batch_id }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Calculate batch range
        id: calc
        run: |
          python - << 'EOF'
          import os
          
          first = int(os.environ['FIRST_VALID'])
          last = int(os.environ['LAST_VALID'])
          batch_id = int(os.environ['BATCH_ID'])
          total_batches = 4
          
          total_range = last - first + 1
          batch_size = (total_range + total_batches - 1) // total_batches
          
          start = first + (batch_id * batch_size)
          end = min(start + batch_size - 1, last)
          
          if start > end:
              print("::set-output name=skip::true")
          else:
              print("::set-output name=skip::false")
              print(f"::set-output name=start::{start}")
              print(f"::set-output name=end::{end}")
              print(f"Batch {batch_id}: {start} to {end} ({end - start + 1} IDs)")
          EOF
        env:
          FIRST_VALID: ${{ needs.discover.outputs.first_valid_id }}
          LAST_VALID: ${{ needs.discover.outputs.last_valid_id }}
          BATCH_ID: ${{ matrix.batch_id }}

      - name: Run scraper
        if: steps.calc.outputs.skip != 'true'
        run: |
          python scraper.py ${{ steps.calc.outputs.start }} ${{ steps.calc.outputs.end }}
        env:
          BATCH_ID: ${{ matrix.batch_id }}

      - name: Upload results
        if: steps.calc.outputs.skip != 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: results-batch-${{ matrix.batch_id }}
          path: |
            results_batch_*.jsonl
            failed_batch_*.txt
            progress_batch_*.json
          if-no-files-found: ignore
          retention-days: 30
