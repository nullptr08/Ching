name: Adaptive Admission Scraper

on:
  workflow_dispatch:
    inputs:
      start_index:
        description: 'First Valid Start ID (e.g., 11000000)'
        required: true
        default: '11000000'

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run Scraper Script
        run: |
          python main.py ${{ github.event.inputs.start_index }}

      - name: Upload Scraped Results Artifact
        uses: actions/upload-artifact@v4
        with:
          name: admission-results-from-${{ github.event.inputs.start_index }}
          path: scraped_results.csv
          